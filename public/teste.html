<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API_CRUD</title>
    <!-- Tailwind CSS via CDN para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Um pequeno ajuste para transições suaves */
        * {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-cyan-400">API_CRUD</h1>
            <p class="text-gray-400">Painel de Teste Frontend</p>
        </header>

        <!-- Seção do Formulário para Criar e Atualizar -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-8" id="form-section">
            <h2 class="text-2xl font-semibold mb-4 border-b border-gray-700 pb-2">Adicionar / Editar Usuário</h2>
            <form id="userForm">
                <!-- Campo oculto para armazenar o ID do usuário durante a edição -->
                <input type="hidden" id="userId" name="id">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="nome" class="block text-sm font-medium text-gray-300 mb-1">Nome</label>
                        <input type="text" id="nome" name="nome" required class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none" placeholder="João da Silva">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                        <input type="email" id="email" name="email" required class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none" placeholder="joao.silva@email.com">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="senha" class="block text-sm font-medium text-gray-300 mb-1">Senha</label>
                    <input type="password" id="senha" name="senha" class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none" placeholder="•••••••• (Obrigatória apenas na criação)">
                </div>

                <div class="flex items-center justify-end space-x-3">
                    <button type="button" id="cancelEditBtn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-md hidden">Cancelar Edição</button>
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded-md">Salvar Usuário</button>
                </div>
            </form>
        </div>

        <!-- Seção para Mensagens de Status -->
        <div id="statusMessage" class="mb-8 text-center p-3 rounded-md"></div>

        <!-- Seção da Lista de Usuários -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h2 class="text-2xl font-semibold">Lista de Usuários</h2>
                <button id="reloadListBtn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-3 rounded-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 110 2H4a1 1 0 01-1-1V4a1 1 0 011-1zm10.899 10.899a7.003 7.003 0 01-11.601-2.566 1 1 0 111.885-.666A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b border-gray-700">
                            <th class="p-2">ID</th>
                            <th class="p-2">Nome</th>
                            <th class="p-2">Email</th>
                            <th class="p-2 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="userList">
                        <!-- Os usuários serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
                 <div id="loading" class="text-center p-4 text-gray-400">Carregando usuários...</div>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // --- CONFIGURAÇÃO ---
    // !!! IMPORTANTE: Verifique se esta URL corresponde ao seu ambiente local !!!
    const API_BASE_URL = 'http://localhost/api_crud/public/'; // Ajuste se necessário

    // --- ELEMENTOS DO DOM ---
    const userForm = document.getElementById('userForm');
    const userIdInput = document.getElementById('userId');
    const nomeInput = document.getElementById('nome');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const userList = document.getElementById('userList');
    const statusMessage = document.getElementById('statusMessage');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const reloadListBtn = document.getElementById('reloadListBtn');
    const loadingDiv = document.getElementById('loading');

    // --- FUNÇÕES DA API ---

    // 1. Buscar todos os usuários (GET)
    const fetchUsers = async () => {
        loadingDiv.style.display = 'block';
        userList.innerHTML = ''; // Limpa a lista antes de carregar
        try {
            const response = await fetch(`${API_BASE_URL}usuarios`);
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || `Erro HTTP: ${response.status}`);
            }
            const data = await response.json();
            renderUsers(data);
            showStatus('Usuários carregados com sucesso!', 'success');
        } catch (error) {
            showStatus(`Erro ao buscar usuários: ${error.message}`, 'error');
            userList.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-red-400">${error.message}</td></tr>`;
        } finally {
            loadingDiv.style.display = 'none';
        }
    };
    
    // 2. Criar um novo usuário (POST)
    const createUser = async (userData) => {
        try {
            const response = await fetch(`${API_BASE_URL}usuarios/criar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message);
            
            showStatus(result.message, 'success');
            resetForm();
            fetchUsers();
        } catch (error) {
            showStatus(`Erro ao criar usuário: ${error.message}`, 'error');
        }
    };

    // 3. Atualizar um usuário (PUT)
    const updateUser = async (id, userData) => {
        try {
            const response = await fetch(`${API_BASE_URL}usuarios/atualizar/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });
             const result = await response.json();
            if (!response.ok) throw new Error(result.message);
            
            showStatus(result.message, 'success');
            resetForm();
            fetchUsers();
        } catch (error) {
            showStatus(`Erro ao atualizar usuário: ${error.message}`, 'error');
        }
    };

    // 4. Deletar um usuário (DELETE)
    const deleteUser = async (id) => {
        if (!confirm(`Tem certeza que deseja deletar o usuário com ID ${id}?`)) return;
        
        try {
             const response = await fetch(`${API_BASE_URL}usuarios/deletar/${id}`, {
                method: 'DELETE'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message);

            showStatus(result.message, 'success');
            fetchUsers();
        } catch (error) {
            showStatus(`Erro ao deletar usuário: ${error.message}`, 'error');
        }
    };

    // --- FUNÇÕES AUXILIARES ---

    // Renderiza a lista de usuários na tabela
    const renderUsers = (users) => {
        userList.innerHTML = ''; // Limpa a lista
        if (!users || users.length === 0) {
             userList.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">Nenhum usuário encontrado.</td></tr>`;
             return;
        }

        users.forEach(user => {
            const tr = document.createElement('tr');
            tr.className = 'border-b border-gray-700 hover:bg-gray-700/50';
            tr.innerHTML = `
                <td class="p-2">${user.id}</td>
                <td class="p-2">${user.nome}</td>
                <td class="p-2">${user.email}</td>
                <td class="p-2 text-right">
                    <button class="edit-btn bg-blue-600 hover:bg-blue-500 text-white text-sm py-1 px-2 rounded-md" data-id="${user.id}" data-nome="${user.nome}" data-email="${user.email}">Editar</button>
                    <button class="delete-btn bg-red-600 hover:bg-red-500 text-white text-sm py-1 px-2 rounded-md ml-2" data-id="${user.id}">Deletar</button>
                </td>
            `;
            userList.appendChild(tr);
        });
    };
    
    // Mostra mensagem de status
    const showStatus = (message, type) => {
        statusMessage.textContent = message;
        statusMessage.className = `mb-8 text-center p-3 rounded-md ${type === 'success' ? 'bg-green-500/20 text-green-300' : 'bg-red-500/20 text-red-300'}`;
        setTimeout(() => { statusMessage.textContent = ''; statusMessage.className = ''; }, 4000);
    };

    // Reseta o formulário para o modo de criação
    const resetForm = () => {
        userForm.reset();
        userIdInput.value = '';
        senhaInput.required = true;
        senhaInput.disabled = false;
        cancelEditBtn.classList.add('hidden');
    };

    // Preenche o formulário para edição
    const populateFormForEdit = (id, nome, email) => {
        userIdInput.value = id;
        nomeInput.value = nome;
        emailInput.value = email;
        senhaInput.required = false; // Senha não é obrigatória na atualização
        senhaInput.disabled = true; // Desabilitar para evitar atualização acidental
        senhaInput.placeholder = "A senha não pode ser editada";
        cancelEditBtn.classList.remove('hidden');
        document.getElementById('form-section').scrollIntoView({ behavior: 'smooth' });
    };

    // --- EVENT LISTENERS ---

    // Submit do formulário (Cria ou Atualiza)
    userForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = userIdInput.value;
        const userData = {
            nome: nomeInput.value,
            email: emailInput.value,
        };

        if (id) {
            // Se tem ID, é uma atualização
            updateUser(id, userData);
        } else {
            // Se não tem ID, é uma criação
            userData.senha = senhaInput.value;
            createUser(userData);
        }
    });

    // Cliques na lista de usuários (para Editar e Deletar)
    userList.addEventListener('click', (e) => {
        // Botão Editar
        if (e.target.classList.contains('edit-btn')) {
            const { id, nome, email } = e.target.dataset;
            populateFormForEdit(id, nome, email);
        }
        // Botão Deletar
        if (e.target.classList.contains('delete-btn')) {
            const { id } = e.target.dataset;
            deleteUser(id);
        }
    });

    // Botão Cancelar Edição
    cancelEditBtn.addEventListener('click', resetForm);

    // Botão para recarregar a lista
    reloadListBtn.addEventListener('click', fetchUsers);
    
    // --- CARGA INICIAL ---
    fetchUsers();
});
</script>

</body>
</html>
